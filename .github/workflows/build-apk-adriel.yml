name: Build APK (adriel-lint)

on:
  push:
    branches: [adriel-lint]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-adriel-lint
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: apk-adriel-lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restaurar google-services.json e keystore de debug
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore

      - name: Versao do build (minutos desde 2026, cresce em qualquer branch)
        run: |
          echo "VC=$(( ($(date +%s) - 1767225600) / 60 ))" >> "$GITHUB_ENV"

      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace \
            -PversionCodeCi="$VC" -PcanalAtualizacao="$TAG"

      - name: Renomear APK
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/app-debug.apk "ClinicaVidaPlus.apk"
          # Mesma assinatura em todas as branches (senão um APK não instala por cima do outro).
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" sign --ks ~/.android/debug.keystore --ks-pass pass:android             --ks-key-alias androiddebugkey --key-pass pass:android ClinicaVidaPlus.apk
          "$APKSIGNER" verify --print-certs ClinicaVidaPlus.apk | grep SHA-256
          echo "SHORT=$SHORT" >> "$GITHUB_ENV"
          NOTAS=$(git log -1 --format=%s | sed 's/^[a-z]*: //')
          jq -n --argjson vc "$VC" --arg vn "1.0.$VC" --arg commit "$SHORT" --arg notas "$NOTAS" \
            --arg apk "https://github.com/${{ github.repository }}/releases/download/$TAG/ClinicaVidaPlus.apk" \
            '{versionCode: $vc, versionName: $vn, commit: $commit, notas: $notas, apk: $apk}' > versao.json
          cat versao.json

      - uses: actions/upload-artifact@v4
        with:
          name: ClinicaVidaPlus-${{ env.SHORT }}
          path: ClinicaVidaPlus.apk

      - name: Publicar Release (link fixo para o celular)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$TAG" --cleanup-tag -y || true
          gh release create "$TAG" ClinicaVidaPlus.apk versao.json \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK adriel-lint (${SHORT})" \
            --notes "Build automatico da branch adriel-lint, commit ${SHORT}. Baixar: ClinicaVidaPlus.apk"
